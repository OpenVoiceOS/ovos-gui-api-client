[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-gui-api-client"
dynamic = ["version"]
description = "Template-based GUI interface for OpenVoiceOS skills"
readme = "README.md"
license = "apache-2.0"
authors = [{name = "OpenVoiceOS", email = "jarbasai@mailfence.com"}]
requires-python = ">=3.9"
dependencies = [
    "ovos-utils>=0.7.0,<1.0.0",
    "ovos-bus-client>=1.3.8a1,<2.0.0",
    "ovos-config>=0.0.12,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-gui-api-client"
Repository = "https://github.com/OpenVoiceOS/ovos-gui-api-client"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["ovos_gui_api_client*"]

[tool.setuptools.dynamic]
version = {attr = "ovos_gui_api_client.version.__version__"}
