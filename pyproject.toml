[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-gui-api-client"
dynamic = ["version"]
description = "Public client interface for OVOS skills and plugins to drive the GUI layer"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "OpenVoiceOS", email = "jarbasai@mailfence.com" }]
keywords = ["ovos", "mycroft", "gui", "client", "skill"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "ovos-config",
    "ovos-utils",
    "ovos-bus-client>=1.0.0,<3.0.0",
]

[project.urls]
Homepage      = "https://github.com/OpenVoiceOS/ovos-gui-api-client"
Repository    = "https://github.com/OpenVoiceOS/ovos-gui-api-client"
"Bug Tracker" = "https://github.com/OpenVoiceOS/ovos-gui-api-client/issues"

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ovos_gui_api_client*"]

[tool.setuptools.dynamic]
version = { attr = "ovos_gui_api_client.version.__version__" }
